name: Build & Deploy Soroban Contracts

on:
  workflow_dispatch:
    inputs:
      deploy_network:
        description: 'Network to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          wget https://github.com/stellar/stellar-cli/releases/download/v26.0.0/stellar-cli-26.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli-26.0.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv stellar /usr/local/bin/
          stellar --version

      - name: Pin serde to avoid serde_core breakage
        run: cargo update -p serde --precise 1.0.227

      - name: Build all contracts
        run: stellar contract build

      - name: List WASM files
        run: find target -name "*.wasm" -type f | head -20

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts
          path: |
            target/wasm32-unknown-unknown/release/credential_contract.wasm
            target/wasm32-unknown-unknown/release/reputation_contract.wasm
            target/wasm32-unknown-unknown/release/governance_contract.wasm

      - name: Deploy Reputation Contract
        if: success()
        env:
          STELLAR_SECRET_KEY: ${{ secrets.SPONSOR_SECRET }}
        run: |
          NETWORK=${{ github.event.inputs.deploy_network }}
          if [ "$NETWORK" = "mainnet" ]; then
            RPC_URL="https://soroban-rpc.mainnet.stellar.gateway.fm"
            NETWORK_PASSPHRASE="Public Global Stellar Network ; September 2015"
          else
            RPC_URL="https://soroban-testnet.stellar.org"
            NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
          fi

          echo "🚀 Deploying Reputation Contract to $NETWORK..."
          REP_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/reputation_contract.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE")
          echo "✅ Reputation Contract ID: $REP_ID"
          echo "REPUTATION_CONTRACT_ID=$REP_ID" >> $GITHUB_ENV

      - name: Deploy Governance Contract
        if: success()
        env:
          STELLAR_SECRET_KEY: ${{ secrets.SPONSOR_SECRET }}
        run: |
          NETWORK=${{ github.event.inputs.deploy_network }}
          if [ "$NETWORK" = "mainnet" ]; then
            RPC_URL="https://soroban-rpc.mainnet.stellar.gateway.fm"
            NETWORK_PASSPHRASE="Public Global Stellar Network ; September 2015"
          else
            RPC_URL="https://soroban-testnet.stellar.org"
            NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
          fi

          echo "🚀 Deploying Governance Contract to $NETWORK..."
          GOV_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/governance_contract.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE")
          echo "✅ Governance Contract ID: $GOV_ID"
          echo "GOVERNANCE_CONTRACT_ID=$GOV_ID" >> $GITHUB_ENV

      - name: Print Contract IDs
        if: success()
        run: |
          echo "============================================"
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "============================================"
          echo "Reputation Contract ID: $REPUTATION_CONTRACT_ID"
          echo "Governance Contract ID: $GOVERNANCE_CONTRACT_ID"
          echo ""
          echo "Add these to your Vercel environment variables:"
          echo "  VITE_REPUTATION_CONTRACT_ID=$REPUTATION_CONTRACT_ID"
          echo "  VITE_GOVERNANCE_CONTRACT_ID=$GOVERNANCE_CONTRACT_ID"
          echo "============================================"
