name: TrustChain CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  RUST_TOOLCHAIN: 'stable'

jobs:
  # ─── Frontend Build & Lint ───────────────────────────────────
  build-and-test:
    name: 🏗️ Build & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trustchain-frontend-build
          path: dist/
          retention-days: 14

  # ─── Soroban Contract Check ──────────────────────────────────
  contract-check:
    name: 🦀 Soroban Contract Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 🔄 Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: ✅ Check credential contract
        working-directory: contracts/credential
        run: cargo check

      - name: ✅ Check reputation contract
        working-directory: contracts/reputation
        run: cargo check

      - name: 🔨 Build credential contract (WASM)
        working-directory: contracts/credential
        run: cargo build --target wasm32-unknown-unknown --release

      - name: 🔨 Build reputation contract (WASM)
        working-directory: contracts/reputation
        run: cargo build --target wasm32-unknown-unknown --release

  # ─── Security Audit ──────────────────────────────────────────
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Deploy Preview (only on PRs) ───────────────────────────
  deploy-preview:
    name: 🚀 Deploy Status
    runs-on: ubuntu-latest
    needs: [build-and-test, contract-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 TrustChain CI/CD Pipeline — All checks passed!"
          echo "Frontend build: ✅"
          echo "Soroban contracts: ✅"
          echo "Ready for deployment"
